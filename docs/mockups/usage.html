<!doctype html>
<html lang="ko" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loom 사용량 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 토큰은 web/src/styles.css와 같다(다크). */
:root {
  color-scheme: light dark;
  --bg: light-dark(oklch(97% 0 0), oklch(20.5% 0 0));
  --panel: light-dark(oklch(98.5% 0 0), oklch(23.5% 0 0));
  --surface: light-dark(oklch(100% 0 0), oklch(26.9% 0 0));
  --surface-hover: light-dark(oklch(93.7% 0 0), oklch(32.9% 0 0));
  --line: light-dark(oklch(92.2% 0 0), oklch(33% 0 0));
  --ink: light-dark(oklch(20.5% 0 0), oklch(98.5% 0 0));
  --ink-2: light-dark(oklch(37.1% 0 0), oklch(80% 0 0));
  --ink-3: light-dark(oklch(50% 0 0), oklch(70.9% 0 0));
  --accent: light-dark(oklch(20.5% 0 0), oklch(92.2% 0 0));
  --accent-wash: light-dark(oklch(20.5% 0 0 / 0.07), oklch(92.2% 0 0 / 0.12));
  --warn: light-dark(oklch(54% 0.12 87), oklch(80% 0.15 87));
  --shadow: light-dark(oklch(0% 0 0 / 0.16), oklch(0% 0 0 / 0.55));
  --font: 'Pretendard', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; }
html { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
button { font: inherit; color: inherit; }
.doc { width: 1440px; margin: 0 auto; padding: 32px 40px 64px; display: grid; gap: 28px; }
h1 { font-size: 18px; }
figcaption { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 8px; }
img { display: block; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; }

.stage { position: relative; height: 420px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.statusbar { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; display: flex; align-items: stretch; background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); padding: 0 4px; }
.usage-btn { display: inline-flex; align-items: center; gap: 10px; padding: 0 10px; background: var(--accent-wash); color: var(--ink); border: 0; cursor: pointer; font-size: 12px; white-space: nowrap; }
.usage-btn .who { font-weight: 600; }
.usage-btn .sep { width: 1px; align-self: stretch; margin: 6px 2px; background: var(--line); }
.lim { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.meter { display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--surface-hover); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.meter i.low { background: var(--warn); }

.pop { position: absolute; left: 4px; bottom: 34px; width: 360px; background: var(--surface); border-radius: 10px; box-shadow: 0 12px 32px var(--shadow); padding: 12px 0 8px; display: grid; font-size: 12px; }
.pop h3 { display: flex; align-items: center; padding: 0 14px 8px; font-size: 14px; font-weight: 600; }
.pop h3 .spacer { flex: 1; }
.icon-btn { display: inline-flex; width: 26px; height: 26px; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: none; color: var(--ink-2); }
.icon-btn svg, .prov svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.divider { border: 0; border-top: 1px solid var(--line); }
.prov-sec { display: grid; gap: 6px; padding: 10px 14px; }
.prov { display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 6px; margin: -4px -6px; border: 0; border-radius: 6px; background: none; cursor: pointer; text-align: left; font-size: 13px; }
.prov:hover, .prov[aria-expanded="true"] { background: var(--surface-hover); }
.prov .who { font-weight: 600; }
.prov .acct-name { color: var(--ink-2); }
.prov svg { margin-left: auto; color: var(--ink-3); }
.win { display: grid; grid-template-columns: 64px minmax(0, 1fr) 44px auto; gap: 6px 8px; }
/* 창 줄은 같은 칸을 나눠 쓴다. 그래야 줄마다 막대 끝과 남은 시간이 나란하다. */
.win > :not(.win-line) { grid-column: 1 / -1; }
.win-line { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; color: var(--ink-2); }
.win-line > :first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win-line .meter { width: auto; height: 6px; border-radius: 3px; }
.win-line .pct { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.win-line .left { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 12px; }
.reset { color: var(--ink-3); }
.acct-list { list-style: none; padding: 0; display: grid; gap: 2px; }
.acct { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 13px; }
.acct[aria-current="true"] { background: var(--accent-wash); }
.acct .sub { margin-left: auto; font-size: 12px; color: var(--ink-3); }
.foot { display: flex; align-items: center; padding: 8px 14px 0; color: var(--ink-3); }
.foot .btn { margin-left: auto; height: 26px; padding: 0 8px; border: 0; border-radius: 6px; background: none; color: var(--ink-2); font-size: 12px; }
</style>
</head>
<body>
<main class="doc">
<h1>사용량: 상태 줄 한 덩어리, 팝오버 하나</h1>

<figure><figcaption>전: 공급자마다 따로 누른다(현재 제품)</figcaption><img src="usage-before.png" alt="현재 loom 하단. Claude 칸을 눌러 Claude만 보이는 팝오버가 열려 있다." width="1440" height="400"></figure>

<figure><figcaption>후: 상태 줄 전체가 버튼 하나, 팝오버에 모든 공급자·모델 창</figcaption>
<div class="stage">
  <div class="pop" role="dialog" aria-label="사용량">
    <h3>사용량<span class="spacer"></span><button class="icon-btn" aria-label="새로 고침"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button></h3>
    <hr class="divider">
    <section class="prov-sec">
      <button class="prov" aria-expanded="true"><span class="who">Claude</span><span class="acct-name">시스템 기본</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
      <div class="win">
        <div class="win-line"><span>5시간</span><span class="meter"><i style="width:46%"></i></span><span class="pct">46%</span><span class="left">2시간 41분 남음</span></div>
        <div class="win-line"><span>주간</span><span class="meter"><i style="width:38%"></i></span><span class="pct">38%</span><span class="left">4일 6시간 남음</span></div>
        <div class="win-line"><span>Fable</span><span class="meter"><i style="width:100%"></i></span><span class="pct">100%</span><span class="left">4일 6시간 남음</span></div>
        <span class="reset">5시간 창 초기화 (화) 11:29 · 주간 창 초기화 (토) 20:59</span>
      </div>
      <ul class="acct-list" aria-label="Claude 계정">
        <li class="acct" aria-current="true">시스템 기본<span class="sub">쓰는 중</span></li>
        <li class="acct">personal@gmail.com<span class="sub">87% 사용</span></li>
      </ul>
    </section>
    <hr class="divider">
    <section class="prov-sec">
      <button class="prov" aria-expanded="false"><span class="who">Codex</span><span class="acct-name">시스템 기본</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="win">
        <div class="win-line"><span>주간</span><span class="meter"><i style="width:87%"></i></span><span class="pct">87%</span><span class="left">1일 4시간 남음</span></div>
        <span class="reset">주간 창 초기화 (일) 08:30</span>
      </div>
    </section>
    <hr class="divider">
    <div class="foot">지금 갱신<button class="btn">계정 관리…</button></div>
  </div>
  <footer class="statusbar" aria-label="상태 줄">
    <button class="usage-btn" aria-expanded="true" aria-label="사용량">
      <span class="who">Claude</span><span>시스템 기본</span>
      <span class="lim"><span class="meter"><i style="width:46%"></i></span>5시간 46%</span>
      <span class="lim"><span class="meter"><i style="width:38%"></i></span>주간 38%</span>
      <span class="lim"><span class="meter"><i style="width:100%"></i></span>Fable 100%</span>
      <span class="sep" aria-hidden="true"></span>
      <span class="who">Codex</span><span>시스템 기본</span>
      <span class="lim"><span class="meter"><i style="width:87%"></i></span>주간 87%</span>
    </button>
  </footer>
</div>
</figure>

<figure><figcaption>참고: Orca 상태 줄(「사용」 버튼 하나에 모든 공급자)</figcaption><img src="usage-orca.png" alt="Orca 하단 상태 줄. 사용 라벨 뒤에 Claude 54%·62%·Fable 0%, Codex 13%가 한 버튼 안에 있다." width="1288" height="60"></figure>
</main>
</body>
</html>
