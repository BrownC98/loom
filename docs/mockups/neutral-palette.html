<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>무채색 디자인 언어</title>
<style>
  body { margin: 0; padding: 24px; background: #e5e5e5; font: 13px/1.4 Pretendard, system-ui, sans-serif; color: #171717; }
  h2 { font-size: 13px; margin: 24px 0 8px; }
  .row { display: flex; gap: 16px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-size: 12px; margin-bottom: 4px; color: #404040; }
  img { display: block; width: 720px; box-shadow: 0 2px 12px #0002; }
  img.orca { width: auto; height: 704px; }
</style>

<h2>참고: Orca 사이드바(다크). 회색에 색이 없고, 고른 항목은 더 밝은 회색이다</h2>
<img class="orca" src="neutral-orca.png" alt="Orca 사이드바 캡처">

<h2>메인 화면과 커밋 그래프 · 다크</h2>
<div class="row">
  <figure><figcaption>전: 바탕·선·글자가 파란 회색, 강조가 파랑</figcaption><img src="neutral-before-graph-dark.png" alt=""></figure>
  <figure><figcaption>후: 무채색 회색, 강조는 흰색, 실행 중만 파랑</figcaption><img src="neutral-after-graph-dark.png" alt=""></figure>
</div>

<h2>메인 화면과 커밋 그래프 · 라이트</h2>
<div class="row">
  <figure><figcaption>전</figcaption><img src="neutral-before-graph-light.png" alt=""></figure>
  <figure><figcaption>후: 강조는 검정, 차선 색은 Orca 색상</figcaption><img src="neutral-after-graph-light.png" alt=""></figure>
</div>

<h2>설정 · 다크</h2>
<div class="row">
  <figure><figcaption>전</figcaption><img src="neutral-before-settings-dark.png" alt=""></figure>
  <figure><figcaption>후: 켜진 스위치는 흰 바탕에 검은 손잡이</figcaption><img src="neutral-after-settings-dark.png" alt=""></figure>
</div>

<h2>설정 · 라이트</h2>
<div class="row">
  <figure><figcaption>전</figcaption><img src="neutral-before-settings-light.png" alt=""></figure>
  <figure><figcaption>후</figcaption><img src="neutral-after-settings-light.png" alt=""></figure>
</div>
</html>
