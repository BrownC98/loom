# 개발 환경. 호스트에는 Rust·Node를 설치하지 않는다. Claude Code·Codex·OpenCode 2 버전은 docs/design.md 「실측 근거」와 같다.
# 빌드 산출물과 패키지 캐시는 볼륨에 둔다. 저장소가 있는 /mnt/c(9p)에서 빌드하면 느리다.
services:
  dev:
    build:
      context: .
      args:
        # 컨테이너 홈을 호스트 홈과 같은 경로로 만든다. 훅·설정이 절대 경로로 서로를 가리킨다.
        HOST_HOME: ${HOME}
      dockerfile_inline: |
        FROM rust:1.99-trixie
        ARG HOST_HOME
        COPY --from=node:24-trixie-slim /usr/local/bin/node /usr/local/bin/node
        COPY --from=node:24-trixie-slim /usr/local/lib/node_modules /usr/local/lib/node_modules
        # 저장소 설정 스크립트(orca.yaml scripts.setup)가 부르는 docker compose. 호스트 docker에 소켓으로 닿는다.
        COPY --from=docker:28.5.2-cli /usr/local/bin/docker /usr/local/bin/docker
        COPY --from=docker:28.5.2-cli /usr/local/libexec/docker/cli-plugins/docker-compose /usr/local/libexec/docker/cli-plugins/docker-compose
        RUN ln -s ../lib/node_modules/npm/bin/npm-cli.js /usr/local/bin/npm \
         && rustup component add clippy rustfmt \
         && apt-get update && apt-get install -y --no-install-recommends clang lld llvm && rm -rf /var/lib/apt/lists/* \
         && rustup target add x86_64-pc-windows-msvc \
         && cargo install --locked cargo-xwin@0.23.1 \
         && npm install -g @anthropic-ai/claude-code@2.1.303 @openai/codex@0.159.2 @opencode/cli@2.0.32 \
         && useradd -m -u 1000 -d $$HOST_HOME dev \
         && mkdir -p /cache/cargo /work/target /work/web/node_modules $$HOST_HOME/.loom \
              $$HOST_HOME/.config $$HOST_HOME/.local/share $$HOST_HOME/.local/state \
         && chown -R dev /cache /work $$HOST_HOME/.loom $$HOST_HOME/.config $$HOST_HOME/.local
        ENV CARGO_HOME=/cache/cargo
        # cargo-xwin이 받는 Windows SDK·CRT. 볼륨에 두어 컨테이너를 다시 만들어도 다시 받지 않는다.
        ENV XWIN_CACHE_DIR=/cache/cargo/xwin
        USER dev
    image: loom-dev
    init: true
    working_dir: /work
    command: sleep infinity
    volumes:
      - .:/work
      - target:/work/target
      - node_modules:/work/web/node_modules
      - cargo:/cache/cargo
      # loom DB와 계정 로그인 폴더. 컨테이너를 다시 만들어도 남는다.
      - loom_home:${HOME}/.loom
      # 에이전트 노드가 호스트 로그인·설정을 같이 쓴다. loom은 이 파일들을 고치지 않는다.
      - ${HOME}/.claude:${HOME}/.claude
      - ${HOME}/.claude.json:${HOME}/.claude.json
      - ${HOME}/.codex:${HOME}/.codex
      - ${HOME}/.config/opencode:${HOME}/.config/opencode
      - ${HOME}/.local/share/opencode:${HOME}/.local/share/opencode
      - ${HOME}/.local/state/opencode:${HOME}/.local/state/opencode
      - ${HOME}/.agents:${HOME}/.agents:ro
      - ${HOME}/.gitconfig:${HOME}/.gitconfig:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # 사람의 저장소 폴더는 compose.override.yaml(저장소에 넣지 않는다)에서 호스트와 같은 경로로 넣는다. 예: AGENTS.md 「개발 환경」.
    # 호스트 docker 소켓의 그룹. setup.sh가 .env에 적는다.
    group_add:
      - ${DOCKER_GID:?bash scripts/worktree/setup.sh를 다시 실행한다}
    # 노드의 claude가 사용자 설정의 ANTHROPIC_BASE_URL(호스트 127.0.0.1 프록시)에 닿아야 한다.
    # 데몬은 127.0.0.1:$LOOM_PORT에서 듣는다.
    network_mode: host
    environment:
      LOOM_PORT: ${LOOM_PORT:-7420}

volumes:
  target:
  node_modules:
  loom_home:
  cargo:
