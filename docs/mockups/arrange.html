<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>노드 정렬</title>
<style>
  :root { color-scheme: dark; --bg: #0d1117; --surface: #161b22; --line: #30363d; --ink: #e6edf3; --ink-2: #9aa4b2; --accent: #6ea8fe; }
  body { margin: 0; padding: 32px; background: var(--bg); color: var(--ink); font: 13px/1.4 Pretendard, system-ui, sans-serif; width: 1376px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 0 10px; }
  .row { display: flex; gap: 48px; align-items: flex-start; margin-bottom: 40px; }
  .arrow { align-self: center; font-size: 24px; color: var(--ink-2); }
  .group { position: relative; border: 1px dashed var(--line); border-radius: 10px; width: 440px; }
  .head { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px 0 14px; border-bottom: 1px dashed var(--line); }
  .branch { font: 600 12px 'JetBrains Mono', monospace; }
  .kind { color: var(--ink-2); font-size: 12px; }
  .spacer { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid #3d444d; background: var(--surface); color: var(--ink); font-size: 12px; font-weight: 500; }
  .btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
  .btn.new { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .body { position: relative; height: 330px; }
  .card { position: absolute; width: 120px; height: 70px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 6px 8px; box-sizing: border-box; font-size: 12px; }
  svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; stroke: #4b5563; stroke-width: 1.5; }
</style>

<h2>묶음 머리</h2>
<div class="row">
  <div class="group"><div class="head">
    <span class="branch">main</span><span class="kind">원래 체크아웃</span><span class="spacer"></span>
    <span class="btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>새 노드</span>
  </div></div>
  <span class="arrow">→</span>
  <div class="group"><div class="head">
    <span class="branch">main</span><span class="kind">원래 체크아웃</span><span class="spacer"></span>
    <span class="btn ghost new"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M6.5 10v4.5H14"/></svg>정렬</span>
    <span class="btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>새 노드</span>
  </div></div>
</div>

<h2>[정렬]을 누르면: 끈 위치를 버리고 부모 아래로 다시 놓는다</h2>
<div class="row">
  <div class="group"><div class="body">
    <svg class="edges"><path d="M90 85 L300 150"/><path d="M90 85 L120 255"/><path d="M360 220 L340 265"/></svg>
    <div class="card" style="left:30px;top:15px">부모</div>
    <div class="card" style="left:270px;top:150px">자식 1</div>
    <div class="card" style="left:60px;top:255px">자식 2</div>
    <div class="card" style="left:290px;top:265px">손자</div>
  </div></div>
  <span class="arrow">→</span>
  <div class="group"><div class="body">
    <svg class="edges"><path d="M80 85 L80 125"/><path d="M80 85 L220 125"/><path d="M80 195 L80 235"/></svg>
    <div class="card" style="left:20px;top:15px">부모</div>
    <div class="card" style="left:20px;top:125px">자식 1</div>
    <div class="card" style="left:160px;top:125px">자식 2</div>
    <div class="card" style="left:20px;top:235px">손자</div>
  </div></div>
</div>
</html>
