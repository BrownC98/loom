  --panel: light-dark(oklch(98.5% 0 0), oklch(23.5% 0 0));
  --surface: light-dark(oklch(100% 0 0), oklch(26.9% 0 0));
  --surface-hover: light-dark(oklch(93.7% 0 0), oklch(32.9% 0 0));
  --line: light-dark(oklch(92.2% 0 0), oklch(33% 0 0));
  --line-strong: light-dark(oklch(87% 0 0), oklch(40% 0 0));
  --ink: light-dark(oklch(20.5% 0 0), oklch(98.5% 0 0));
  --ink-2: light-dark(oklch(37.1% 0 0), oklch(80% 0 0));

  --accent: light-dark(oklch(20.5% 0 0), oklch(92.2% 0 0));
  --accent-wash: light-dark(oklch(20.5% 0 0 / 0.07), oklch(92.2% 0 0 / 0.12));
  --warn: light-dark(oklch(54% 0.12 87), oklch(80% 0.15 87));
  --err: light-dark(oklch(55% 0.2 27), oklch(70% 0.17 25));
  --font: 'Pretendard', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; }
html { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
button { font: inherit; color: inherit; }
.doc { width: 1440px; margin: 0 auto; padding: 32px 40px 64px; display: grid; gap: 28px; }
.who { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); }
.who b { color: var(--ink); }
h1 { font-size: 18px; }
h2 { font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
h2 .tag { font: 12px var(--mono); color: var(--ink-3); }
.fig { display: grid; gap: 10px; }

.canvas { background: var(--panel); border-radius: 12px; padding: 12px; width: fit-content; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 24px; align-items: start; }
.canvas svg { display: block; }
.grp { fill: var(--surface-hover); fill-opacity: .35; stroke: var(--line-strong); }
.grp.new, .card.new { stroke: var(--warn); stroke-dasharray: 6 4; stroke-width: 2; }
.card { fill: var(--surface); stroke: var(--line-strong); }
.lbl { font: 600 15px var(--font); fill: var(--ink); }
.glbl { font: 13px var(--mono); fill: var(--ink-3); }
.edge { fill: none; stroke: var(--ink-3); stroke-width: 1.5; }
.edge.hit { stroke: var(--err); stroke-width: 2; }
.stats { font: 12px var(--mono); color: var(--ink-3); }
.theme-toggle { position: fixed; top: 16px; right: 16px; height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 13px; cursor: pointer; }
</style>

const anchor = (k, side) => ({ top: [k.x + k.w / 2, k.y], bottom: [k.x + k.w / 2, k.y + k.h], left: [k.x, k.y + k.h / 2], right: [k.x + k.w, k.y + k.h / 2] })[side];
const normal = { top: [0, -1], bottom: [0, 1], left: [-1, 0], right: [1, 0] };
const grid = document.getElementById('grid');
for (const c of CASES) {
  const W = Math.max(...c.groups.map((g) => g.x + g.w)), H = Math.max(...c.groups.map((g) => g.y + g.h));
  const scale = Math.min(MAXW / W, MAXH / H);
  const byId = Object.fromEntries(c.cards.map((k) => [k.id, k]));
  let out = '', hits = 0, len = 0, cross = 0;
  const segs = [];
  for (const g of c.groups) out += '<rect class="grp" x="' + g.x + '" y="' + g.y + '" width="' + g.w + '" height="' + g.h + '" rx="10"/><text class="glbl" x="' + (g.x + 16) + '" y="' + (g.y + 40) + '" style="font-size:40px">' + g.name + '</text>';
  // 계단 간선: 나무 쪽 간선은 부모 카드 바로 아래 틈에서 꺾는다(규칙 E). 그 밖의 간선과 ①(지금)은 베지어다.
  const tree = { down: ['bottom', 'top'], up: ['top', 'bottom'], right: ['right', 'left'], left: ['left', 'right'] }[c.dir];
  for (const e of c.edges) {
    const p = byId[e.from], q = byId[e.to];
    const a = anchor(p, e.parent), b = anchor(q, e.child);
    let pts;
    if (e.parent === tree[0] && e.child === tree[1]) {
      const v = c.dir === 'down' || c.dir === 'up', i = v ? 1 : 0, n = normal[e.parent][i];
      const bend = a[i] + n * Math.min(BEND, Math.abs(b[i] - a[i]) / 2);
      pts = v ? [a, [a[0], bend], [b[0], bend], b] : [a, [bend, a[1]], [bend, b[1]], b];
    } else {
      const d = Math.max(40, Math.hypot(b[0] - a[0], b[1] - a[1]) / 2);
      const c1 = [a[0] + normal[e.parent][0] * d, a[1] + normal[e.parent][1] * d], c2 = [b[0] + normal[e.child][0] * d, b[1] + normal[e.child][1] * d];
      pts = Array.from({ length: 41 }, (_, t) => { t /= 40; const u = 1 - t; return [0, 1].map((k) => u*u*u*a[k] + 3*u*u*t*c1[k] + 3*u*t*t*c2[k] + t*t*t*b[k]); });
    }
    let hit = false;
    for (let s = 1; s < pts.length; s++) {
      const [p0, p1] = [pts[s - 1], pts[s]], steps = 100;
      len += Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
      for (let t = 0; t <= steps; t++) {
        const r = [p0[0] + (p1[0] - p0[0]) * t / steps, p0[1] + (p1[1] - p0[1]) * t / steps];
        for (const o of c.cards) if (o.id !== p.id && o.id !== q.id && r[0] > o.x && r[0] < o.x + o.w && r[1] > o.y && r[1] < o.y + o.h) hit = true;
      }
    }
    for (let s = 1; s < pts.length; s++) segs.push({ from: e.from, a: pts[s - 1], b: pts[s] });
    if (hit) hits++;
    out += '<polyline class="edge' + (hit ? ' hit' : '') + '" style="stroke-width:' + (1.5 / scale) + '" points="' + pts.map((r) => r.join(',')).join(' ') + '"/>';
  }
  // 간선끼리 만남: 부모가 다른 두 간선에서 세로 선분이 다른 간선의 가로 선분 안쪽에 닿거나 지나는 곳.
  for (const p of segs) for (const q of segs) {
    if (p.from >= q.from) continue;
    const h = p.a[1] === p.b[1] ? p : q.a[1] === q.b[1] ? q : null, v = h === p ? q : p;
    if (!h || v.a[0] !== v.b[0] || h === v) continue;
    const [x0, x1] = [Math.min(h.a[0], h.b[0]), Math.max(h.a[0], h.b[0])], [y0, y1] = [Math.min(v.a[1], v.b[1]), Math.max(v.a[1], v.b[1])];
    if (v.a[0] > x0 && v.a[0] < x1 && h.a[1] >= y0 && h.a[1] <= y1 && y1 > y0) cross++;
  }
  for (const k of c.cards) out += '<rect class="card" x="' + k.x + '" y="' + k.y + '" width="' + k.w + '" height="' + k.h + '" rx="12" style="stroke-width:3"/><text class="lbl" x="' + (k.x + 24) + '" y="' + (k.y + 60) + '" style="font-size:44px">' + k.name + '</text>';
  const fig = document.createElement('div');
  fig.className = 'fig';
  fig.innerHTML = '<h2>' + c.title + ' <span class="tag">그래프 › [정렬] 뒤' + (c.dir === 'down' ? '' : ' · 오른쪽으로') + '</span></h2><div class="canvas"><svg viewBox="-10 -10 ' + (W + 20) + ' ' + (H + 20) + '" width="' + Math.round((W + 20) * scale) + '" height="' + Math.round((H + 20) * scale) + '">' + out + '</svg></div><p class="stats">그림 ' + W + ' × ' + H + 'px · 간선 길이 합 ' + Math.round(len) + 'px · 카드를 지나는 간선 ' + hits + '개 · 간선끼리 만남 ' + cross + '곳</p>';
  grid.appendChild(fig);
}
</script>
</body>
</html>
