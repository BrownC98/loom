[package]
name = "loom"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
jiff = "0.2.38"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "net", "process", "time", "io-util"] }
ts-rs = "12.0.1"
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls"] }
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"
