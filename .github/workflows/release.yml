# 사람이 손으로 돌릴 때만 Windows 설치 파일과 Linux 실행 파일을 만들어 Release `v<판>`으로 올린다.
# 앱은 가장 새 Release의 `latest.json`으로 새 판을 찾는다. 근거: docs/design.md 「Windows 앱」 「배포」.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # PATCH는 커밋 수다. 전체 기록이 있어야 센다.
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2.9.2
      # 판 = 루트 Cargo.toml의 MAJOR.MINOR + 그 줄을 마지막으로 바꾼 커밋 뒤의 커밋 수.
      # loom.exe, 앱, 설치 파일, 화면이 같은 판을 쓴다.
      - name: 판 정하기
        id: version
        run: |
          version=$(sh scripts/version.sh)
          sed -i "s/^version = \".*\"$/version = \"$version\"/" Cargo.toml
          sed -i "s/^name = \"loom-app\"$/&\nversion = \"$version\"/" app/Cargo.toml
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 화면 빌드
        run: npm ci && npm run build
        working-directory: web
        env:
          # build 스크립트가 sh 문법으로 판을 넣는다. Windows 기본 셸(cmd)로는 돌지 않는다.
          NPM_CONFIG_SCRIPT_SHELL: bash
      - name: loom.exe 빌드
        run: |
          cargo build --release
          mkdir -p app/binaries
          cp target/release/loom.exe app/binaries/loom-x86_64-pc-windows-msvc.exe
      - name: 설치 파일 빌드, Release에 올리기
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: npx --yes @tauri-apps/cli@2.12.3
          tagName: v${{ steps.version.outputs.version }}
          releaseName: loom ${{ steps.version.outputs.version }}
          releaseBody: ${{ github.ref_name }} ${{ github.sha }} 빌드. 설치 파일(`-setup.exe`)을 실행하면 loom 창이 열린다.

  # Release는 위 단계가 만든다. 정적 실행 파일(musl)이라 glibc 판과 관계없이 x86-64 Linux에서 돈다.
  linux:
    needs: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # 화면 빌드가 scripts/version.sh로 판을 센다.
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2.9.2
      - name: 판 쓰기
        run: sed -i "s/^version = \".*\"$/version = \"${{ needs.installer.outputs.version }}\"/" Cargo.toml
      - name: 화면 빌드
        run: npm ci && npm run build
        working-directory: web
      - name: loom 빌드, Release에 올리기
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/loom loom-x86_64-linux
          gh release upload "v${{ needs.installer.outputs.version }}" loom-x86_64-linux --clobber
        env:
          GH_TOKEN: ${{ github.token }}
