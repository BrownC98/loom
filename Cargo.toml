[package]
name = "loom"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
jiff = "0.2.38"
portable-pty = "0.9.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
strip-ansi-escapes = "0.2.1"
subtle = "2.6.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "net", "process", "time", "io-util"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect"] }
tower-http = { version = "0.6.11", features = ["fs"] }
ts-rs = "12.0.1"
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls", "socks-proxy"] }
vt100 = "0.18"
which = "8.0.6"
yaml-rust2 = "0.13.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# 호스트(WSL)에서 만든 Windows 디버그 빌드는 Linux 경로의 `skills/`·`web/dist`를 읽지 못한다. 디버그에서도 파일을 싣는다.
[target.'cfg(windows)'.dependencies]
rust-embed = { version = "8.13.0", features = ["debug-embed"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
serde_json = "1.0.154"
schemars = "0.8.22"
typify = { version = "0.8.0", default-features = false }
