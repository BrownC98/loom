[package]
name = "loom-desktop"
edition = "2024"
license = "MIT"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "08cbb88a152c3751a43e853425a70e9f631a5918" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "08cbb88a152c3751a43e853425a70e9f631a5918", features = ["font-kit", "x11", "wayland"] }

alacritty_terminal = "=0.26.0"
api = { path = "../api" }
async-channel = "2"
polling = "3"
serde = "1"
serde_json = "1"
unicode-width = "0.2"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
ureq = { version = "3", default-features = false }
wuff = { version = "0.2.9", default-features = false, features = ["brotli"] }

[lints.rust]
warnings = "deny"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
