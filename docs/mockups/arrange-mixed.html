<!doctype html>
<html lang="ko" style="color-scheme: light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>섞인 자식 정렬 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 토큰과 줄 모양은 web/src/styles.css와 같다(화이트 테마). */
:root {
  --bg: light-dark(oklch(97% 0 0), oklch(20.5% 0 0));
  --panel: light-dark(oklch(98.5% 0 0), oklch(23.5% 0 0));
  --surface: light-dark(oklch(100% 0 0), oklch(26.9% 0 0));
  --surface-hover: light-dark(oklch(93.7% 0 0), oklch(32.9% 0 0));
  --line: light-dark(oklch(92.2% 0 0), oklch(33% 0 0));
  --line-strong: light-dark(oklch(87% 0 0), oklch(40% 0 0));
  --ink: light-dark(oklch(20.5% 0 0), oklch(98.5% 0 0));
  --ink-2: light-dark(oklch(37.1% 0 0), oklch(80% 0 0));
  --ink-3: light-dark(oklch(50% 0 0), oklch(70.9% 0 0));
  --accent: light-dark(oklch(20.5% 0 0), oklch(92.2% 0 0));
  --accent-wash: light-dark(oklch(20.5% 0 0 / 0.07), oklch(92.2% 0 0 / 0.12));
  --warn: light-dark(oklch(54% 0.12 87), oklch(80% 0.15 87));
  --err: light-dark(oklch(55% 0.2 27), oklch(70% 0.17 25));
  --font: 'Pretendard', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; }
html { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
button { font: inherit; color: inherit; }
.doc { width: 1440px; margin: 0 auto; padding: 32px 40px 64px; display: grid; gap: 28px; }
.who { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); }
.who b { color: var(--ink); }
h1 { font-size: 18px; }
h2 { font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
h2 .tag { font: 12px var(--mono); color: var(--ink-3); }
.fig { display: grid; gap: 10px; }

.canvas { background: var(--panel); border-radius: 12px; padding: 12px; width: fit-content; }
.canvas svg { display: block; }
.grp { fill: var(--surface-hover); fill-opacity: .35; stroke: var(--line-strong); }
.grp.new, .card.new { stroke: var(--warn); stroke-dasharray: 6 4; stroke-width: 2; }
.card { fill: var(--surface); stroke: var(--line-strong); }
.lbl { font: 600 15px var(--font); fill: var(--ink); }
.glbl { font: 13px var(--mono); fill: var(--ink-3); }
.edge { fill: none; stroke: var(--ink-3); stroke-width: 1.5; }
.edge.hit { stroke: var(--err); stroke-width: 2; }
.stats { font: 12px var(--mono); color: var(--ink-3); }
.theme-toggle { position: fixed; top: 16px; right: 16px; height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<main class="doc">
  <div class="who"><span>응답할 곳: <b>총괄 · loom 총괄</b></span><span>연 담당: <b>총괄 · loom 총괄</b></span><span>v2 · 2026-10-21</span></div>
  <h1>그래프 › [정렬]: 같은 워크트리 자식과 자식 워크트리가 섞인 경우</h1>
  <div class="fig">
    <h2>① 지금 <span class="tag">그래프 › ktasearch 저장소 › [정렬] 뒤</span></h2>
    <div class="canvas"><svg id="s1"></svg></div>
    <p class="stats" id="t1"></p>
  </div>
  <div class="fig">
    <h2>② 권장: 자식 묶음이 부모 묶음 옆, 부모 카드 다음 줄 <span class="tag">그래프 › ktasearch 저장소 › [정렬] 뒤</span></h2>
    <div class="canvas"><svg id="s2"></svg></div>
    <p class="stats" id="t2"></p>
  </div>
  <div class="fig">
    <h2>③ 다른 안: 자식 묶음이 부모 묶음 옆, 같은 줄 <span class="tag">그래프 › ktasearch 저장소 › [정렬] 뒤</span></h2>
    <div class="canvas"><svg id="s3"></svg></div>
    <p class="stats" id="t3"></p>
  </div>
</main>
<button type="button" class="theme-toggle" onclick="const h=document.documentElement;const dark=h.style.colorScheme==='dark';h.style.colorScheme=dark?'light':'dark';this.textContent=dark?'다크로 보기':'라이트로 보기';">다크로 보기</button>
<script>
// 좌표는 그래프 px(저장소 원점 기준). 카드 600×466, 묶음 머리 60·옆 20, 묶음 틈 32.
// ①은 layout.ts의 arrangeTree·placeGroups를 이 모양으로 돌린 값이다.
const CW = 600, CH = 466, SCALE = 0.3;
const names = { A: 'ktasearch-총괄', B: '피드백 반영', C: '매뉴얼체계-코디', D: '판정근거-코디', E: '판정근거-관문' };
const parent = { C: 'B', D: 'B', E: 'D' };
const plans = {
  s1: { cards: { A: [20, 60], B: [640, 60], C: [294, 638], D: [950, 1216], E: [950, 1794] }, groups: [['main', 0, 0, 1240, 1124], ['판정근거-범위', 930, 1156, 640, 1124]], changed: [] },
  s2: { cards: { A: [20, 60], B: [640, 60], C: [640, 638], D: [1292, 638], E: [1292, 1216] }, groups: [['main', 0, 0, 1240, 1124], ['판정근거-범위', 1272, 578, 640, 1124]], changed: ['C', '판정근거-범위', 'D', 'E'] },
  s3: { cards: { A: [20, 60], B: [640, 60], C: [640, 638], D: [1292, 60], E: [1292, 638] }, groups: [['main', 0, 0, 1240, 1124], ['판정근거-범위', 1272, 0, 640, 1124]], changed: ['C', '판정근거-범위', 'D', 'E'] },
};
// layout.ts edgeSides와 같다: 자식이 부모보다 아래면 아래→위, 아니면 틈이 큰 축의 마주 보는 변.
function ends(p, c) {
  if (c[1] >= p[1] + CH) return { a: [p[0] + CW / 2, p[1] + CH], b: [c[0] + CW / 2, c[1]], v: true };
  return c[0] > p[0] ? { a: [p[0] + CW, p[1] + CH / 2], b: [c[0], c[1] + CH / 2], v: false } : { a: [p[0], p[1] + CH / 2], b: [c[0] + CW, c[1] + CH / 2], v: false };
}
for (const [id, plan] of Object.entries(plans)) {
  const at = plan.cards;
  const W = Math.max(...plan.groups.map((g) => g[1] + g[3])), H = Math.max(...plan.groups.map((g) => g[2] + g[4]));
  let out = '', hits = 0, len = 0;
  for (const [n, x, y, w, h] of plan.groups) out += `<rect class="grp${plan.changed.includes(n) ? ' new' : ''}" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"/><text class="glbl" x="${x + 16}" y="${y + 36}" style="font-size:40px">${n}</text>`;
  for (const [k, p] of Object.entries(parent)) {
    const { a, b, v } = ends(at[p], at[k]);
    const m = v ? (b[1] - a[1]) / 2 : (b[0] - a[0]) / 2;
    const c1 = v ? [a[0], a[1] + m] : [a[0] + m, a[1]], c2 = v ? [b[0], b[1] - m] : [b[0] - m, b[1]];
    const pt = (t) => { const u = 1 - t; return [0, 1].map((i) => u*u*u*a[i] + 3*u*u*t*c1[i] + 3*u*t*t*c2[i] + t*t*t*b[i]); };
    let hit = false, prev = a;
    for (let i = 1; i <= 400; i++) {
      const q = pt(i / 400); len += Math.hypot(q[0] - prev[0], q[1] - prev[1]); prev = q;
      for (const o of Object.keys(at)) if (o !== k && o !== p && q[0] > at[o][0] && q[0] < at[o][0] + CW && q[1] > at[o][1] && q[1] < at[o][1] + CH) hit = true;
    }
    if (hit) hits++;
    out += `<path class="edge${hit ? ' hit' : ''}" style="stroke-width:5" d="M${a} C${c1} ${c2} ${b}"/>`;
  }
  for (const [k, [x, y]] of Object.entries(at)) out += `<rect class="card${plan.changed.includes(k) ? ' new' : ''}" x="${x}" y="${y}" width="${CW}" height="${CH}" rx="12" style="stroke-width:3"/><text class="lbl" x="${x + 24}" y="${y + 56}" style="font-size:40px">${names[k]}</text>`;
  const svg = document.getElementById(id);
  svg.setAttribute('viewBox', `-10 -10 ${W + 20} ${H + 20}`);
  svg.setAttribute('width', Math.round((W + 20) * SCALE));
  svg.setAttribute('height', Math.round((H + 20) * SCALE));
  svg.innerHTML = out;
  const empty = 1 - (Object.keys(at).length * CW * CH) / (W * H);
  const full = [`${W} × ${H}`, (W / H).toFixed(2), `${Math.round(len)}px`, `${hits}개`, `${Math.round(empty * 100)}%`];
  document.getElementById('t' + id.slice(1)).textContent = `그림 ${full[0]}px (가로:세로 ${full[1]}) · 간선 길이 합 ${full[2]} · 카드를 지나는 간선 ${full[3]} · 빈 넓이 ${full[4]}`;
}
</script>
</body>
</html>
