name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  TAURI_CLI: 2.12.3
  LOOM_RELEASES: https://github.com/${{ github.repository }}/releases

jobs:
  wsl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2.9.2
      - name: 판 쓰기
        run: |
          version=$(sh scripts/version.sh)
          sed -i "s/^version = \".*\"$/version = \"$version\"/" Cargo.toml
      - name: 화면 빌드
        run: npm ci && npm run build
        working-directory: web
      - name: Linux loom 빌드
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: loom-linux
          path: target/x86_64-unknown-linux-musl/release/loom
          if-no-files-found: error

  installer:
    needs: wsl
    strategy:
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2.9.2
      - name: 판 정하기
        id: version
        run: |
          version=$(sh scripts/version.sh)
          # macOS의 sed는 `-i` 문법이 달라 perl로 고친다. Windows 러너의 체크아웃은 줄 끝이 CRLF라 `\r`을 남긴다.
          perl -pi -e "s/^version = \".*\"(\r?)\$/version = \"$version\"\$1/" Cargo.toml
          perl -pi -e "s/^name = \"loom-app\"(\r?)\$/\$&\nversion = \"$version\"\$1/" app/Cargo.toml
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 태그로 돌면 태그 이름이 판과 같아야 한다. 다르면 Release 이름과 앱 판이 어긋난다.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "태그 $GITHUB_REF_NAME 이(가) 판 v$version 과 다르다. 'git tag v\$(sh scripts/version.sh)'로 태그를 붙인다." >&2
            exit 1
          fi
      - name: 화면 빌드
        run: npm ci && npm run build
        working-directory: web
        env:
          NPM_CONFIG_SCRIPT_SHELL: bash
      - name: loom 빌드
        run: |
          cargo build --release
          mkdir -p app/binaries
          triple=$(rustc -vV | sed -n 's/^host: //p')
          exe=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          cp "target/release/loom$exe" "app/binaries/loom-$triple$exe"
      - name: Linux loom 받기
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8.0.2
        with:
          name: loom-linux
          path: app/binaries/linux
      - name: Linux loom 이름 맞추기
        if: runner.os == 'Windows'
        run: mv app/binaries/linux/loom app/binaries/loom-linux
      - name: 설치 템플릿 받기
        if: runner.os == 'Windows'
        shell: bash
        run: |
          nsi=app/windows/installer.nsi
          curl -fsSL "https://raw.githubusercontent.com/tauri-apps/tauri/tauri-cli-v$TAURI_CLI/crates/tauri-bundler/src/bundle/windows/nsis/installer.nsi" -o "$nsi"
          line='  ${IfThen} "$R0$R1" == "" ${|} Abort ${|}'
          [ "$(grep -cxF "$line" "$nsi")" = 1 ] || { echo "Tauri $TAURI_CLI 템플릿에 이전 판 확인 줄이 없다. 패치를 다시 맞춘다." >&2; exit 1; }
          awk -v line="$line" '$0 == line { print "  Abort"; next } { print }' "$nsi" > "$nsi.tmp" && mv "$nsi.tmp" "$nsi"
      - name: 설치 파일 빌드, Release에 올리기
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: npx --yes @tauri-apps/cli@${{ env.TAURI_CLI }}
          tagName: v${{ steps.version.outputs.version }}
          releaseName: loom ${{ steps.version.outputs.version }}
          releaseBody: |
            ${{ github.ref_name }} ${{ github.sha }} 빌드.
            - Windows 앱: `loom_<판>_x64-setup.exe`를 받아 실행하면 loom 창이 열린다.
            - macOS 앱(Apple Silicon): 터미널에서 `curl -fsSL https://raw.githubusercontent.com/BrownC98/loom/main/scripts/install.sh | sh`를 실행하면 앱을 응용 프로그램 폴더에 넣고 연다. 터미널 없이는 `loom_<판>_aarch64.dmg`를 열어 loom을 응용 프로그램 폴더로 끌고, 서명하지 않은 앱이라 처음 한 번 터미널에서 `xattr -cr /Applications/loom.app`를 실행한 뒤 연다.
            - Android 앱: 폰에서 `loom_<판>.apk`를 받아 설치한다. 폰과 PC에 Tailscale이 있어야 한다. PC loom의 설정 › 휴대폰 › [휴대폰 연결]에 나온 QR을 앱에서 찍는다.
            - 웹 버전(앱 없이 브라우저로, `loom-web-*` 파일): 아래 명령이 받는다. Linux·WSL `curl -fsSL https://raw.githubusercontent.com/BrownC98/loom/main/scripts/install.sh | sh`, Windows PowerShell `irm https://raw.githubusercontent.com/BrownC98/loom/main/scripts/install.ps1 | iex`.
      - name: macOS 안쪽 호스트와 서명 확인
        if: runner.os == 'macOS'
        run: |
          cargo test --test distro_host
          codesign --verify --verbose target/release/loom
      - name: 웹 버전 실행 파일 올리기
        run: |
          version=v${{ steps.version.outputs.version }}
          case "$RUNNER_OS" in
          Windows)
            cp app/binaries/loom-linux loom-web-linux-x64
            gh release upload "$version" loom-web-linux-x64 --clobber
            cp target/release/loom.exe loom-web-windows-x64.exe; asset=loom-web-windows-x64.exe ;;
          macOS) cp target/release/loom loom-web-macos-arm64; asset=loom-web-macos-arm64 ;;
          esac
          gh release upload "$version" "$asset" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  android:
    needs: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: 9.7.1
      - name: APK 빌드, Release에 올리기
        working-directory: android
        run: |
          version=${{ needs.installer.outputs.version }}
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$LOOM_KEYSTORE"
          # AGP 9는 단위 시험을 debug 빌드 유형에만 만든다. testReleaseUnitTest는 없어 v0.1.953 android 잡이 실패했다.
          gradle --no-daemon -PloomVersion="$version" -PloomVersionCode="$(git rev-list --count HEAD)" -PloomReleases="$LOOM_RELEASES" testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "loom_$version.apk"
          gh release upload "v$version" "loom_$version.apk" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          LOOM_KEYSTORE: ${{ runner.temp }}/release.jks
          LOOM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
